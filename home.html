<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/home.css">
    <title>Studium Routines - Home</title>
</head>
<body>
    <header class="topo">
        <div class="logo">Studium Routine</div>
        <div class="saudacao-usuario">
            <p>Bem-Vindo! (nome do usuário)</p>
            <div class="foto-perfil-topo"></div>
        </div>
    </header>

 <a href="index.html" class="botao-voltar">
    <img src="seta.png" alt="Voltar para a página inicial" class="icone-seta">
    </a>
    
    <main class="home-container">
        
        <div class="card-perfil-grande">
            <div class="circulo-foto"></div>
            <h2 class="nome-usuario">Nome</h2>

            <div class="caixa-dados">
                <div class="info-barra">Total de Tarefas: 0</div>
                <div class="info-barra">Tempo de Estudo: ---</div>
                <div class="info-barra">Próximo Evento: ---</div>
            </div>
        </div> 

        <div class="secao-cards-home">
    
            <a href="tarefas.html" class="card-link">
                <div class="card-home card-cor-1">
                    <p class="card-titulo">Minhas Tarefas</p>
                    <img src="caderno1.png" alt="Ícone de Tarefas" class="card-img">
                </div>
            </a>
          
            <a href="pomodoro-foco.html" class="card-link">
                <div class="card-home card-cor-2">
                    <p class="card-titulo">Pomodoro Personalizado</p>
                    <img src="pomodoro.png" alt="Ícone Pomodoro" class="card-img">
                </div>
            </a>
           
            <a href="routines.html" class="card-link">
                <div class="card-home card-cor-3">
                    <p class="card-titulo">Routines</p>
                    <img src="rotinas.png" alt="Ícone Routines" class="card-img">
                </div>
            </a>

        </div>

    </main>

    <footer class="rodape-projeto">
        <p>Desenvolvido por Estéfani Lopes dos S. Souza</p>
        <p><a href="https://github.com/Stellar-starlight/studium-routines.git" target="_blank">Repositório no GitHub</a></p>
        <p>© 2026</p>
    </footer>


</body>
</html>

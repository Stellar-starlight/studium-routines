<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/lembretes.css">
    <title>Studium Routine - Lembretes de Tarefas</title>
</head>
<body>

    <header class="topo">
        <div class="logo">Studium Routine</div>
        <div class="saudacao-usuario">
            <p>(nome do usuário)</p>
            <div class="foto-perfil-topo"></div>
        </div>
    </header>

    <a href="tarefas.html" class="botao-voltar">
                <img src="img/seta.png" alt="Voltar">
            </a>

    <main class="lembretes-container">

        <div class="header-secao">
            <div class="titulo-com-icone">
                <img src="img/caderno1.png" alt="Caderno" class="icone-titulo">
                <h1>Lembretes de Tarefas</h1>
            </div>
        </div>

        <div class="lista-lembretes">
            
            <div class="card-lembrete">
                <div class="info-lembrete">
                    <h2>Notificações por E-mail</h2>
                    <p>Receber avisos diários sobre tarefas pendentes.</p>
                </div>
                <div class="interruptor ativo">
                    <div class="circulo-interno"></div>
                </div>
            </div>

            <div class="card-lembrete">
                <div class="info-lembrete">
                    <h2>Aviso de Prazo Vencido</h2>
                    <p>Alerta quando uma tarefa passar da data de conclusão.</p>
                </div>
                <div class="interruptor">
                    <div class="circulo-interno"></div>
                </div>
            </div>

            <div class="card-lembrete">
                <div class="info-lembrete">
                    <h2>Resumo Semanal</h2>
                    <p>Receber um balanço das atividades da semana.</p>
                </div>
                <div class="interruptor ativo">
                    <div class="circulo-interno"></div>
                </div>
            </div>

        </div>

    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/tarefas.css">
    <title>Studium Routine - Minhas Tarefas</title>
</head>
<body>
    <header class="topo">
        <div class="logo">Studium Routine</div>
        <div class="saudacao-usuario">
            <p>(nome do usuário)</p>
            <div class="foto-perfil-topo"></div>
        </div>
    </header>

    <main class="tarefas-container">
        <div class="header-secao">
            <a href="home.html" class="botao-voltar">
                <img src="img/seta.png" alt="Voltar">
            </a>
            <div class="titulo-com-icone">
                <img src="img/caderno1.png" alt="Caderno" class="icone-titulo">
                <h1>Minhas Tarefas</h1>
            </div>
        </div>

        <div class="acoes-topo">
           
            <a href="nova-tarefa.html" class="item-acao-link">
                <img src="img/nova-tarefa.png" alt="Adicionar Nova Tarefa" class="img-acao">
                <p>Adicionar Nova Tarefa</p>
            </a>

            <a href="notificacao-tarefas.html" div class="item-acao-link">
                <img src="img/lembrete-tarefas.png" alt="Lembretes" class="img-acao">
                <p>Lembretes de Tarefas</p>
         
            <a href="lixeira.html" div class="item-acao-link">
                <img src="img/lixeira.png" alt="Lixeira" class="img-acao">
                <p>Lixeira</p>
            </div>
        </div>

        <div class="card-tarefa">
            
            <div class="tarefa-topo">
                <h2>Biologia</h2>
                <a href="#" class="descartar" title="Excluir tarefa">
                    <img src="img/descartar.png" alt="Descartar">
                </a>
            </div>
            
            <hr class="linha-tarefa">

            <div class="tarefa-descricao">
                <p><strong>Descrição:</strong> Trabalho de Pesquisa sobre Teorias da Evolução.</p>
            </div>

            <hr class="linha-tarefa">

            <div class="tarefa-rodape">
                <div class="info-data">
                    <p>Data de Conclusão: <strong>30/09/2026</strong></p>
                    <p>Status: <p class="status-pendente">Pendente</p></p>
                </div>
                <div class="acao-concluir">
                    <label for="concluir">Marcar como concluído</label>
                    <input type="checkbox" id="concluir">
                </div>
            </div>
        </div>

    </main>

    
</body>
</html>
